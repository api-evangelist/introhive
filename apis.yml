apis:
- name: Introhive Platform OAuth
  description: 'The OAuth 2.0 authorization surface in front of the Introhive platform.
    Introhive publishes an RFC 8414 OAuth 2.0 Authorization Server Metadata document
    at /.well-known/oauth-authorization-server on each regional platform host (US, Canada,
    UK), advertising authorization-code and refresh-token grants with PKCE (S256) and
    an in-product OAuth application registry at /oauth/applications. This is the only
    machine-readable API contract Introhive publishes anonymously; there is no public
    developer portal, OpenAPI/Swagger description, or API reference — the underlying
    resource API is documented to customers only.'
