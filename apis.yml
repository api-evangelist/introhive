aid: introhive
name: Introhive
description: 'Introhive is a relationship intelligence and CRM data automation platform
  used primarily by professional services firms — law, accounting, consulting and the
  built environment — to remove manual CRM data entry. It passively mines employee
  email and calendar systems to build a firm-wide relationship graph of who knows whom
  and how strong each relationship is, then cleans, de-duplicates and enriches contact,
  company and activity records before writing them back into the system of record.
  Introhive integrates with Salesforce, Microsoft Dynamics 365, HubSpot and legal/accounting
  practice systems, and surfaces the resulting intelligence through a relationship portal,
  digest emails and CRM-embedded apps. The company is headquartered in Fredericton,
  New Brunswick, Canada, and operates regional platform instances for the US, Canada
  and the UK.'
